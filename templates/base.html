{% load static %}<!doctype html>
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% if page_title %}{{ page_title }} | {% endif %}OCEANZ STEM HUB{% endblock %}</title>
  <meta name="description" content="{% block description %}OCEANZ STEM HUB teaches Mathematics, Science and Coding/Digital Technologies (M.S.C) to Primary, Secondary and Tertiary learners, online, on-site and hybrid.{% endblock %}">
  <meta name="theme-color" content="#070d2b">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="preload" href="{% static 'fonts/manrope-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="{% static 'js/theme.js' %}"></script>
  <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% include "includes/header.html" %}
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
  {% include "includes/footer.html" %}
  {% include "includes/contact_float.html" %}
</body>
</html>
