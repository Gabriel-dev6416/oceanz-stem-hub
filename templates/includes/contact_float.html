{% load contact %}
<div class="contact-float">
  <a class="float-whatsapp" href="{% whatsapp_link site_settings.whatsapp page_title %}" rel="noopener" target="_blank" aria-label="Chat with us on WhatsApp">{% include "icons/chat.html" %}</a>
  <a class="float-call" href="{{ site_settings.phone_primary|tel_link }}" aria-label="Call {{ site_settings.phone_primary }}">{% include "icons/phone.html" %}</a>
</div>
<nav class="phone-bar" aria-label="Quick actions">
  <a class="btn btn-accent" href="{% url 'messaging:enquire' %}">Enrol Now</a>
  <a class="btn btn-whatsapp" href="{% whatsapp_link site_settings.whatsapp page_title %}" rel="noopener" target="_blank">{% include "icons/chat.html" %}WhatsApp</a>
  <a class="btn btn-call" href="{{ site_settings.phone_primary|tel_link }}" aria-label="Call {{ site_settings.phone_primary }}">{% include "icons/phone.html" %}</a>
</nav>
